[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gt-input-addon"
version = "1.0.0"
description = "Standalone preparation of external GT input files"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1.3,<2.6", "pymsis>=0.13.0,<0.14"]

[project.scripts]
gt-fetch = "fetcher:main"

[tool.setuptools]
py-modules = ["fetcher"]
