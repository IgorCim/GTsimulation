name: TA15 scientific reference audit
on:
  push:
    branches: [codex/input-data-addon]
    paths:
      - .github/workflows/ta15-audit.yml
      - verification/check_ta15_reference.py
      - verification/ta15-audit/sources.json
      - verification/ta15-audit/reference_driver.f90
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUMBA_DISABLE_JIT: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GT without Geant4
        run: python -m pip install . --config-settings=cmake.define.BUILD_GEANT4_COMPONENTS=OFF
      - name: Fetch checksum-pinned official references
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from urllib.request import urlopen
          root=Path('verification/ta15-audit')
          for name,meta in json.loads((root/'sources.json').read_text()).items():
              with urlopen(meta['url'],timeout=60) as r: body=r.read()
              assert hashlib.sha256(body).hexdigest()==meta['sha256'], name+' changed upstream; audit halted'
              (root/name).write_bytes(body)
          PY
      - name: Compile unmodified official models
        run: |
          gfortran --version | tee verification/ta15-audit/compiler.txt
          gfortran -std=legacy -ffixed-line-length-none -fallow-argument-mismatch -O2 -fno-fast-math verification/ta15-audit/TA_2015_B.f verification/ta15-audit/geopack08.for verification/ta15-audit/reference_driver.f90 -o verification/ta15-audit/reference
      - name: Compare kernel and frames
        run: python verification/check_ta15_reference.py --reference verification/ta15-audit/reference
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ta15-reference-audit
          path: |
            verification/ta15-audit/audit_result.json
            verification/ta15-audit/compiler.txt
            verification/ta15-audit/sources.json
          if-no-files-found: warn
